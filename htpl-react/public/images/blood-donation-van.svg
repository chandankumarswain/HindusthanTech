<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Mobile blood donation van">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="60" y1="440" x2="740" y2="440" stroke="rgba(239,236,229,0.12)" stroke-width="2"/>
  <!-- cab -->
  <path d="M120 360 L120 250 L210 250 L250 205 L250 360 Z" fill="#e6e2d8"/>
  <path d="M205 252 L238 218 L238 252 Z" fill="#18181a" opacity="0.6"/>
  <!-- body (white clinical) -->
  <rect x="250" y="175" width="430" height="185" rx="10" fill="#f7f5f0"/>
  <rect x="250" y="175" width="430" height="185" rx="10" fill="none" stroke="rgba(24,24,26,0.25)" stroke-width="3"/>
  <!-- red accent stripe -->
  <rect x="250" y="330" width="430" height="30" fill="#d63924"/>
  <!-- window with awning -->
  <rect x="300" y="210" width="150" height="80" rx="6" fill="#18181a" opacity="0.5"/>
  <rect x="290" y="200" width="170" height="12" rx="4" fill="#d63924"/>
  <!-- red cross -->
  <g transform="translate(560,250)">
    <rect x="-14" y="-40" width="28" height="80" fill="#d63924"/>
    <rect x="-40" y="-14" width="80" height="28" fill="#d63924"/>
  </g>
  <!-- wheels -->
  <circle cx="220" cy="440" r="56" fill="#18181a" stroke="#6b6b6e" stroke-width="6"/>
  <circle cx="220" cy="440" r="22" fill="#3a3a3d"/>
  <circle cx="560" cy="440" r="56" fill="#18181a" stroke="#6b6b6e" stroke-width="6"/>
  <circle cx="560" cy="440" r="22" fill="#3a3a3d"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
